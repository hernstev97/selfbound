# Checks for every push to main and every pull request.
#
# Types, unit tests, integration (local Convex in the runner), browser flows (Playwright)
# and a quick performance run. All without cloud access and without secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; each job states what it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      # Includes the stricter test/lib and linear-import projects, so `pnpm typecheck` locally fails
      # exactly where CI would.
      - name: Types
        run: pnpm typecheck

      - name: Translations
        run: node tooling/i18n-check.mjs

      - name: Tests
        run: |
          pnpm test
          pnpm --filter @selfbound/backend test:lib
          pnpm test:tooling

      # Fresh local backend in the runner (port 13490): import twice, MCP SDK client,
      # concurrency with 20 clients, 5 agents and parallel webhooks.
      - name: Integration (local backend)
        run: pnpm --filter @selfbound/backend test:integration

      - name: Playwright browser
        run: pnpm --filter @selfbound/perf exec playwright install --with-deps chromium

      - name: UI (Playwright, own local backend)
        run: pnpm e2e

      - name: Keep Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

      # Performance regression, quick run (perf/README.md): own backend (13520), two builds, vite preview (5522),
      # only P1 · 10,000 issues, few repetitions. Threshold 250 ms p95 instead of 100 ms because shared
      # runners fluctuate. Initial bundle and DOM nodes are load-independent and may be at most 5 % above
      # perf/baseline.json; other deviations from the baseline are only warnings.
      - name: Performance (quick run)
        run: node perf/run.ts --quick --no-pin

      - name: Keep performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-quick
          path: |
            perf/results/
            perf/.backend/.convex-local.log
          if-no-files-found: ignore
