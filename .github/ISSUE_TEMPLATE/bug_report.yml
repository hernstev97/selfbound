name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit you run, or "main".
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11
  - type: markdown
    attributes:
      value: Please remove tokens, keys and personal data from logs and screenshots before posting.
