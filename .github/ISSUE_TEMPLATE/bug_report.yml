name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Selfbound works issue-first: if you want to send a pull request, please wait until the maintainer has added the label `accepted` to this issue. See [CONTRIBUTING.md](https://github.com/hernstev97/xlr8/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit you run, or "main".
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to fix this myself. I will wait for the label `accepted` before opening a pull request.
  - type: markdown
    attributes:
      value: Please remove tokens, keys and personal data from logs and screenshots before posting.
