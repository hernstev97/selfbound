<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Sign-in page. A separate entry that loads nothing from the app. Embedded: Clerk's bot
         protection on sign-in. No marketing here: the public landing page lives in site/. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src https://challenges.cloudflare.com https://*.protect.clerk.com; object-src 'none'; base-uri 'self'" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in · XLR8</title>
    <meta name="theme-color" content="#070709" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Set the color scheme before the first paint (no flash). Same preference as the app.
      (function () {
        var d = document.documentElement;
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          var t = JSON.parse(localStorage.getItem('xlr8:prefs') || '{}').theme || 'system';
          if (t !== 'system') dark = t === 'dark';
        } catch (e) {}
        d.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <header class="top">
      <span class="brand" role="img" aria-label="XLR8"><span class="logo" aria-hidden="true"></span></span>
    </header>

    <main id="sign-in" class="sign-in" aria-labelledby="sign-in-title">
      <div class="sign-in-inner">
        <h1 id="sign-in-title" class="sr-only">Sign in to XLR8</h1>
        <div class="clerk" data-state="loading" aria-busy="true">
          <p class="clerk-note" role="status">Loading sign-in…</p>
        </div>
        <p class="private">XLR8 has one owner. Only the owner of this instance can sign in.</p>
      </div>
    </main>
    <script type="module" src="/src/welcome/main.ts"></script>
  </body>
</html>
