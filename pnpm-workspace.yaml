packages:
  - backend
  - core
  - app
  - e2e
  - perf
  - site
  - docs-site
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  utf-8-validate: false
  core-js: false
  esbuild: true
  tsc-rs: false
minimumReleaseAgeExclude:
  - vite@8.3.4
overrides:
  # Dependabot #6: postcss-nested (Starlight) still asks for ^6.1.1; 7.1.6 has the fix.
  postcss-selector-parser@<7.1.6: 7.1.6
  # Dependabot #1-#5: transitive through clerk-js -> Solana wallet adapter -> @solana/web3.js -> jayson.
  # The browser build never loads jayson's Node-only parts (stream-json, uuid).
  uuid@<11.1.1: 11.1.1
  stream-json@<3.6.0: 3.6.0
  # braces has no patched version. It comes in only through react-native -> metro, which the web build never uses.
  react-native: "-"
